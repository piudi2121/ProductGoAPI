version: "3.9"

services:
  go_app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - go_db
    env_file:
      - .env
    restart: always

  go_db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
